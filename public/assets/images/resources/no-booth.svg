<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
  <!-- Floor -->
  <rect x="40" y="180" width="220" height="8" rx="4" fill="#f0f0f0"/>
  <!-- Booth structure -->
  <rect x="75" y="60" width="150" height="120" rx="8" fill="#fce4f0" stroke="#e91e8c" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- Back wall -->
  <rect x="95" y="75" width="110" height="70" rx="4" fill="#fff" stroke="#e91e8c" stroke-width="1.5"/>
  <!-- Table -->
  <rect x="100" y="150" width="100" height="12" rx="3" fill="#e91e8c" opacity="0.3"/>
  <!-- Table legs -->
  <rect x="110" y="162" width="4" height="16" rx="2" fill="#e91e8c" opacity="0.25"/>
  <rect x="186" y="162" width="4" height="16" rx="2" fill="#e91e8c" opacity="0.25"/>
  <!-- Question mark -->
  <text x="150" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#e91e8c" opacity="0.5">?</text>
  <!-- Circle badge -->
  <circle cx="230" cy="55" r="22" fill="#e91e8c" opacity="0.15"/>
  <line x1="220" y1="45" x2="240" y2="65" stroke="#e91e8c" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="45" x2="220" y2="65" stroke="#e91e8c" stroke-width="3" stroke-linecap="round"/>
</svg>
